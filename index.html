<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Listings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #000000;
            --bg-elevated: #0a0a0a;
            --bg-card: #111111;
            --bg-input: #0d0d0d;
            --bg-hover: #1a1a1a;
            --accent-primary: #10b981;
            --accent-primary-glow: rgba(16, 185, 129, 0.15);
            --accent-info: #38bdf8;
            --accent-info-glow: rgba(56, 189, 248, 0.15);
            --accent-warning: #f59e0b;
            --accent-warning-glow: rgba(245, 158, 11, 0.15);
            --accent-danger: #f43f5e;
            --accent-danger-glow: rgba(244, 63, 94, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --border-subtle: #1f1f1f;
            --border-visible: #2a2a2a;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
            --shadow-glow-green: 0 0 20px rgba(16, 185, 129, 0.2);
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) var(--space-6);
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .header-status {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-4) var(--space-6);
            background: var(--bg-void);
            border-bottom: 1px solid var(--border-subtle);
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .filter-tab {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .filter-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .filter-tab.active {
            background: var(--bg-card);
            border-color: var(--border-visible);
            color: var(--text-primary);
        }

        .filter-count {
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .filter-tab.active .filter-count {
            background: var(--accent-primary);
            color: #000;
        }

        .filter-spacer {
            flex: 1;
        }

        .sort-select {
            padding: var(--space-2) var(--space-3);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .search-control, .exclude-control {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input, .exclude-input {
            padding: var(--space-2) var(--space-3);
            padding-right: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8125rem;
            width: 160px;
        }

        .search-input:focus, .exclude-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-input.has-search {
            border-color: var(--accent-info);
        }

        .exclude-input.has-exclusions {
            border-color: var(--accent-warning);
        }

        .btn-clear {
            position: absolute;
            right: 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
        }

        .btn-clear:hover {
            color: var(--text-primary);
        }

        .main-content {
            padding: var(--space-6);
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--space-4);
        }

        .listing-card {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: all var(--duration-normal) var(--ease-out);
        }

        .listing-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-visible);
            box-shadow: var(--shadow-lg);
        }

        .listing-card.new {
            border-color: var(--accent-info);
            box-shadow: 0 0 0 1px var(--accent-info);
        }

        .listing-card.gone {
            opacity: 0.5;
        }

        .listings-grid[data-filter="gone"] .listing-card.gone {
            opacity: 1;
        }

        .listing-card.hidden {
            display: none;
        }

        .listing-image-container {
            position: relative;
            aspect-ratio: 16 / 10;
            background: var(--bg-input);
            overflow: hidden;
        }

        .listing-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-normal) var(--ease-out);
        }

        .listing-card:hover .listing-image {
            transform: scale(1.05);
        }

        .listing-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
        }

        .listing-badges {
            position: absolute;
            top: var(--space-3);
            left: var(--space-3);
            display: flex;
            gap: var(--space-2);
        }

        .listing-badge {
            padding: var(--space-1) var(--space-3);
            border-radius: 100px;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .listing-badge.new {
            background: var(--accent-info);
            color: #000;
        }

        .listing-badge.gone {
            background: var(--accent-danger);
            color: white;
        }

        .listing-source-badge {
            position: absolute;
            top: var(--space-3);
            right: var(--space-3);
            padding: var(--space-1) var(--space-3);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            font-size: 0.6875rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .listing-body {
            padding: var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-3);
        }

        .listing-title {
            font-size: 0.8125rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .listing-price {
            font-size: 1rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .listing-price.preferred {
            color: var(--accent-primary);
        }

        .listing-price.stretch {
            color: var(--accent-warning);
        }

        .listing-price.over {
            color: var(--accent-danger);
        }

        .listing-specs {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .listing-spec {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1) var(--space-2);
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        .listing-spec-icon {
            font-size: 0.875rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
            text-align: center;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--space-4);
            opacity: 0.3;
        }

        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--space-2);
        }

        .footer {
            padding: var(--space-4) var(--space-6);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid var(--border-subtle);
        }

        @media (max-width: 600px) {
            .filter-bar {
                padding: var(--space-3);
            }
            .main-content {
                padding: var(--space-3);
            }
            .listings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title">
            <span>🚗</span>
            <span>Car Listings</span>
        </div>
        <div class="header-status" id="headerStatus">Loading...</div>
    </header>

    <div class="filter-bar">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
            All <span class="filter-count" id="countAll">0</span>
        </button>
        <button class="filter-tab" data-filter="preferred" onclick="setFilter('preferred')">
            Under £1,500 <span class="filter-count" id="countPreferred">0</span>
        </button>
        <button class="filter-tab" data-filter="stretch" onclick="setFilter('stretch')">
            £1,500–£4,000 <span class="filter-count" id="countStretch">0</span>
        </button>
        <button class="filter-tab" data-filter="new" onclick="setFilter('new')">
            New (24h) <span class="filter-count" id="countNew">0</span>
        </button>
        <button class="filter-tab" data-filter="gone" onclick="setFilter('gone')">
            Sold/Gone <span class="filter-count" id="countGone">0</span>
        </button>
        <div class="filter-spacer"></div>
        <div class="search-control">
            <input type="text" id="searchInput" class="search-input" placeholder="Search..."
                   onchange="updateSearch(this.value)" onkeyup="if(event.key==='Enter')updateSearch(this.value)">
            <button class="btn-clear" onclick="clearSearch()" title="Clear">×</button>
        </div>
        <div class="exclude-control">
            <input type="text" id="excludeInput" class="exclude-input" placeholder="Exclude..."
                   onchange="updateExclusions(this.value)" onkeyup="if(event.key==='Enter')updateExclusions(this.value)">
            <button class="btn-clear" onclick="clearExclusions()" title="Clear">×</button>
        </div>
        <select class="sort-select" onchange="setSort(this.value)">
            <option value="newest">Newest First</option>
            <option value="price-asc">Price: Low→High</option>
            <option value="price-desc">Price: High→Low</option>
            <option value="year-desc">Year: Newest</option>
            <option value="mileage-asc">Mileage: Lowest</option>
        </select>
    </div>

    <main class="main-content">
        <div class="listings-grid" id="listingsGrid" data-filter="all">
        </div>
    </main>

    <footer class="footer">
        Last updated: 01 Feb 2026 at 17:18
    </footer>

"local_image": "images/gumtree_1509039268_0.jpg"}, {"id": "gumtree_1507572451", "source": "gumtree", "source_id": "1507572451", "source_url": "https://www.gumtree.com/p/ford/2008-ford-s-max-2.0-tdci-lx-5dr-mpv-diesel-manual/1507572451", "title": "2008 Ford S-Max 2.0 TDCi LX 5dr MPV Diesel Manual", "price": 2600, "year": 2008, "mileage": 115000, "fuel_type": "diesel", "transmission": "manual", "seats": null, "location": "Eynsham, Oxfordshire", "distance_miles": null, "description": "", "images": ["https://img.gumtree.com/ePR8PyKf84wPHx7_RYmEag/937e2127ec2b487685_aa7f9a8fdbb5/86"], "first_seen_at": "2026-01-27T16:10:36.861951", "last_seen_at": "2026-02-01T15:58:47.903038", "is_gone": false, "gone_at": null, "search_ids": ["22859adb", "default-7-seater"], "notified_at": null, "local_image": "images/gumtree_1507572451_0.jpg"}, {"id": "gumtree_1506791138", "source": "gumtree", "source_id": "1506791138", "source_url": "https://www.gumtree.com/p/fiat/fiat-qubo-mpv-2015-manual-1248-cc-active-multijet-diesel-5-doors/1506791138", "title": "2015 Fiat QUBO MPV", "price": 1000, "year": 2015, "mileage": 119000, "fuel_type": "diesel", "transmission": "manual", "seats": null, "location": "Headington, Oxfordshire", "distance_miles": null, "description": "", "images": [], "first_seen_at": "2026-01-27T16:10:36.861906", "last_seen_at": "2026-01-28T14:46:05.261298", "is_gone": true, "gone_at": "2026-01-30T15:00:29.067599", "search_ids": ["default-7-seater"], "notified_at": null}];
        const preferredBudget = 1500;
        const maxBudget = 4000;
        let currentFilter = 'all';
        let currentSort = 'newest';
        let searchTerms = [];
        let exclusions = [];

        function init() {
            // Load saved preferences from localStorage
            const savedExclusions = localStorage.getItem('car_exclusions');
            if (savedExclusions) {
                exclusions = JSON.parse(savedExclusions);
                document.getElementById('excludeInput').value = exclusions.join(', ');
                if (exclusions.length > 0) document.getElementById('excludeInput').classList.add('has-exclusions');
            }
            const savedSearch = localStorage.getItem('car_search');
            if (savedSearch) {
                searchTerms = JSON.parse(savedSearch);
                document.getElementById('searchInput').value = searchTerms.join(', ');
                if (searchTerms.length > 0) document.getElementById('searchInput').classList.add('has-search');
            }
            renderListings();
            updateStats();
        }

        function isRecent(dateStr) {
            if (!dateStr) return false;
            const date = new Date(dateStr);
            const dayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            return date > dayAgo;
        }

        function getPriceClass(price) {
            if (price <= preferredBudget) return 'preferred';
            if (price <= maxBudget) return 'stretch';
            return 'over';
        }

        function renderListings() {
            const grid = document.getElementById('listingsGrid');
            let filtered = listings;

            // Apply filter
            switch (currentFilter) {
                case 'preferred':
                    filtered = listings.filter(l => !l.is_gone && l.price <= preferredBudget);
                    break;
                case 'stretch':
                    filtered = listings.filter(l => !l.is_gone && l.price > preferredBudget && l.price <= maxBudget);
                    break;
                case 'new':
                    filtered = listings.filter(l => !l.is_gone && isRecent(l.first_seen_at));
                    break;
                case 'gone':
                    filtered = listings.filter(l => l.is_gone);
                    break;
                default:
                    filtered = listings.filter(l => !l.is_gone);
            }

            // Apply exclusions
            if (exclusions.length > 0) {
                filtered = filtered.filter(l => {
                    const title = l.title.toLowerCase();
                    return !exclusions.some(term => title.includes(term.toLowerCase()));
                });
            }

            // Apply search
            if (searchTerms.length > 0) {
                filtered = filtered.filter(l => {
                    const title = l.title.toLowerCase();
                    return searchTerms.some(term => title.includes(term.toLowerCase()));
                });
            }

            // Apply sort
            filtered = sortListings(filtered, currentSort);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-title">No listings found</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(listing => {
                const priceClass = getPriceClass(listing.price);
                const isNew = isRecent(listing.first_seen_at);
                const imageSrc = listing.local_image || (listing.images && listing.images[0]);

                return `
                    <a href="${listing.source_url}" target="_blank" class="listing-card ${isNew ? 'new' : ''} ${listing.is_gone ? 'gone' : ''}">
                        <div class="listing-image-container">
                            ${imageSrc
                                ? `<img src="${imageSrc}" alt="${listing.title}" class="listing-image" onerror="this.parentElement.innerHTML='<div class=\'listing-image-placeholder\'>🚗</div>'">`
                                : `<div class="listing-image-placeholder">🚗</div>`
                            }
                            <div class="listing-badges">
                                ${isNew ? '<span class="listing-badge new">New</span>' : ''}
                                ${listing.is_gone ? '<span class="listing-badge gone">Gone</span>' : ''}
                            </div>
                            <span class="listing-source-badge">${listing.source}</span>
                        </div>
                        <div class="listing-body">
                            <div class="listing-header">
                                <div class="listing-title">${listing.title}</div>
                                <div class="listing-price ${priceClass}">£${listing.price.toLocaleString()}</div>
                            </div>
                            <div class="listing-specs">
                                ${listing.year ? `<span class="listing-spec"><span class="listing-spec-icon">📅</span>${listing.year}</span>` : ''}
                                ${listing.mileage ? `<span class="listing-spec"><span class="listing-spec-icon">🛣️</span>${listing.mileage.toLocaleString()}mi</span>` : ''}
                                ${listing.fuel_type ? `<span class="listing-spec"><span class="listing-spec-icon">⛽</span>${listing.fuel_type}</span>` : ''}
                                ${listing.location ? `<span class="listing-spec"><span class="listing-spec-icon">📍</span>${listing.location}</span>` : ''}
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function sortListings(list, sortKey) {
            const sorted = [...list];
            switch (sortKey) {
                case 'price-asc':
                    return sorted.sort((a, b) => a.price - b.price);
                case 'price-desc':
                    return sorted.sort((a, b) => b.price - a.price);
                case 'year-desc':
                    return sorted.sort((a, b) => (b.year || 0) - (a.year || 0));
                case 'mileage-asc':
                    return sorted.sort((a, b) => (a.mileage || 999999) - (b.mileage || 999999));
                case 'newest':
                default:
                    return sorted.sort((a, b) => new Date(b.first_seen_at || 0) - new Date(a.first_seen_at || 0));
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            document.getElementById('listingsGrid').dataset.filter = filter;
            renderListings();
        }

        function setSort(sortValue) {
            currentSort = sortValue;
            renderListings();
        }

        function updateSearch(value) {
            searchTerms = value.split(',').map(s => s.trim()).filter(s => s.length > 0);
            localStorage.setItem('car_search', JSON.stringify(searchTerms));
            const input = document.getElementById('searchInput');
            input.classList.toggle('has-search', searchTerms.length > 0);
            renderListings();
            updateStats();
        }

        function clearSearch() {
            searchTerms = [];
            localStorage.removeItem('car_search');
            const input = document.getElementById('searchInput');
            input.value = '';
            input.classList.remove('has-search');
            renderListings();
            updateStats();
        }

        function updateExclusions(value) {
            exclusions = value.split(',').map(s => s.trim()).filter(s => s.length > 0);
            localStorage.setItem('car_exclusions', JSON.stringify(exclusions));
            const input = document.getElementById('excludeInput');
            input.classList.toggle('has-exclusions', exclusions.length > 0);
            renderListings();
            updateStats();
        }

        function clearExclusions() {
            exclusions = [];
            localStorage.removeItem('car_exclusions');
            const input = document.getElementById('excludeInput');
            input.value = '';
            input.classList.remove('has-exclusions');
            renderListings();
            updateStats();
        }

        function updateStats() {
            const active = listings.filter(l => !l.is_gone);
            const preferred = active.filter(l => l.price <= preferredBudget);
            const stretch = active.filter(l => l.price > preferredBudget && l.price <= maxBudget);
            const newListings = active.filter(l => isRecent(l.first_seen_at));
            const gone = listings.filter(l => l.is_gone);

            document.getElementById('countAll').textContent = active.length;
            document.getElementById('countPreferred').textContent = preferred.length;
            document.getElementById('countStretch').textContent = stretch.length;
            document.getElementById('countNew').textContent = newListings.length;
            document.getElementById('countGone').textContent = gone.length;
            document.getElementById('headerStatus').textContent = `${active.length} listing${active.length !== 1 ? 's' : ''}`;
        }

        init();
    </script>
</body>
